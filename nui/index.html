<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ddj_bait_car</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="remote" class="remote hidden">
        <div class="fob">
            <div class="fob-body">
                <div class="fob-head">
                    <span class="fob-brand">DDJ</span>
                    <div class="fob-head-right">
                        <span id="fob-led" class="fob-led"></span>
                        <button id="btn-close" class="fob-close" data-action="close">&times;</button>
                    </div>
                </div>

                <!-- LCD readout -->
                <div class="lcd">
                    <div class="lcd-screen">
                        <div class="lcd-meta">
                            <span>UNIT</span>
                            <span id="lcd-index">0 / 0</span>
                        </div>
                        <div id="lcd-model" class="lcd-model">NO UNITS</div>
                        <div id="lcd-plate" class="lcd-plate">&mdash;</div>
                        <div id="lcd-range" class="lcd-range hidden">OUT OF RANGE</div>
                    </div>
                </div>

                <!-- Slim unit selector -->
                <div class="nav">
                    <button class="nav-btn" data-action="prev">&#9664;</button>
                    <button class="nav-btn" data-action="next">&#9654;</button>
                </div>

                <!-- Button cluster -->
                <div class="pad">
                    <button class="btn key" data-action="doors">
                        <span class="btn-icon">&#128274;</span>
                        <span class="btn-label">LOCKS</span>
                    </button>
                    <button class="btn" data-action="locate">
                        <span class="btn-icon">&#128205;</span>
                        <span class="btn-label">LOCATE</span>
                    </button>
                    <button class="btn" data-action="alarm">
                        <span class="btn-icon">&#128680;</span>
                        <span class="btn-label">ALARM</span>
                    </button>
                    <button class="btn" data-action="flash">
                        <span class="btn-icon">&#128161;</span>
                        <span class="btn-label">LIGHTS</span>
                    </button>
                </div>

                <!-- Full width power toggle: kills engine + locks doors -->
                <button class="btn btn-power" data-action="power">
                    <span class="btn-label">POWER</span>
                </button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
